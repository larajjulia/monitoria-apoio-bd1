<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <title>Gráfica</title>
</head>

<body>
    <div id="header"></div>
    <script src="../../components/header/header.js"></script>
    <h1>Solicitar Impressão</h1>
    <label for="livro">Escolha um Livro: </label>
    <select name="" id="livro">
        <option value="null">Selecione um livro</option>
    </select>

    <br><br>

    <label for="grafica">Escolha uma gráfica: </label>
    <select name="" id="grafica">
        <option value="null">Selecione uma gráfica</option>
    </select>

    <br><br>

    <label for="">Número de Cópias: </label>
    <input type="" class="input-class" id="input-copias">

    <br><br>

    <label for="">Data de entrega (YYYY-MM-DD): </label>
    <input type="" class="input-class" id="input-data">

    <br><br>

    <button type="submit" onclick="enviarParaImpressao()">Enviar para Impressão</button>
    <script src="./script.js"></script>
</body>

</html>
